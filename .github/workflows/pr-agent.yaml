name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  issue_comment:
    types:
      - created

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENAI__KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI__API_BASE: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"

          config.model: "openai/qwen3.8-flash"
          config.fallback_models: '["openai/qwen3.8-flash"]'
          config.custom_model_max_tokens: "991808"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/describe", "/review"]'
